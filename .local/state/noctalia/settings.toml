config_version = 16

[audio]
enable_sounds = true

[bar.default]
background_opacity = 0.7799999825656414
capsule = true
capsule_radius = 0
center = [ "clock", "date", "privacy" ]
end = [
    "media",
    "audio_visualizer",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "session"
]
margin_ends = 0
position = "bottom"
radius = 4
start = [ "workspaces", "cpu", "temp", "ram" ]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen]
blur_intensity = 0.99999997764825821
tint_intensity = 0.99999997764825821
transition_duration = 200

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
position = "bottom_right"

[plugin_settings."noctalia/mpvpaper"]
video_directory = "/home/zag/Pictures/Wallpapers"

[plugins]
enabled = []

[shell]
avatar_path = "/home/zag/Pictures/PFPS/0e630b1a3e294304669d5a9b8751519b78f90937_full.png"
corner_radius_scale = 0.0
font_family = "Hack Nerd Font Mono"

    [shell.launcher]
    width = 560

    [shell.panel]
    transparency_mode = "soft"

    [shell.screenshot]
    directory = "/home/zag/Pictures/Screenshots"

[theme]
builtin = "Ayu"
community_palette = "Noctalia legacy"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "emacs", "foot", "gtk3", "gtk4", "niri", "qt" ]
    community_ids = [ "feishin", "neovim" ]

[wallpaper]
directory = "/home/zag/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/zag/Pictures/Wallpapers/wallhaven-vp2odp.png"

    [wallpaper.last]
    path = "/home/zag/Pictures/Wallpapers/wallhaven-vp2odp.png"

    [wallpaper.monitors.DP-2]
    path = "/home/zag/Pictures/Wallpapers/wallhaven-vp2odp.png"

[widget.taskbar]
capsule = true
